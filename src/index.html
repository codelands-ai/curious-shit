<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Curious Shit</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint; text swaps in when they arrive. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Cormorant+SC:wght@500&family=IBM+Plex+Sans:wght@400;500&display=swap&subset=latin"
      media="print"
      onload="this.media='all'"
    />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/gallery.css" />
  </head>
  <body>
    <header class="strip">
      <h1 class="wordmark">Curious Shit</h1>
      <form id="search" class="search" role="search" action="/" autocomplete="off">
        <input
          id="search-input"
          class="search__input"
          type="search"
          name="q"
          maxlength="100"
          placeholder="Search every word on every wall"
          aria-label="Search the posters"
          enterkeyhint="search"
          spellcheck="false"
        />
        <button id="search-clear" class="search__clear" type="button" aria-label="Clear search" hidden>
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </button>
      </form>
      <div class="strip__end"></div>
    </header>
    <main id="hallway" class="hallway">
      <p id="result-status" class="result-status" aria-live="polite" hidden></p>
      <div id="feed" class="feed"></div>
      <div id="feed-status" class="feed-status" aria-live="polite"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
